
#是注释行，
#每个有效配置项用 等号 处理，等号前不超过40个字符，等号后不超过400个字符；

 
#[开头的表示组信息，也等价于注释行
#[Socket]
#ListenPort = 5678    
#DBInfo = 127.0.0.1;1234;myr;123456;mxdb_g

#日志相关
[Log]
#日志文件输出目录和文件名
#Log=logs/error.log
Log=../logs/gplat.log

#只打印日志等级<= 数字 的日志到日志文件中 ，日志等级0-8,0级别最高，8级别最低。
LogLevel = 8

LogRotateFileCount = 3
LogRotateFileSize = 1

#进程相关
[Proc]
#创建这些个worker进程，目前测试下来必须是1，暂时不支持多于1个的worker进程
WorkerProcesses = 1

#是否按守护进程方式运行，1：按守护进程方式运行，0：不按守护进程方式运行
Daemon = 1

#处理接收到的消息的线程池中线程数量，不建议超过300
ProcMsgRecvWorkThreadCount = 3

#和网络相关
[Net]
#监听的端口数量，一般都是1个，当然如果支持多于一个也是可以的
ListenPortCount = 1
#ListenPort+数字【数字从0开始】，这种ListenPort开头的项有几个，取决于ListenPortCount的数量，
ListenPort0 = 8777
#ListenPort1 = 443

#epoll连接的最大数【是每个worker进程允许连接的客户端数】，实际其中有一些连接要被监听socket使用，实际允许的客户端连接数会比这个数小一些
#（客户端连接上限 = worker_connections - 监听端口数）。超出上限的新连接被立即关闭，客户端马上收到连接断开，并限频记日志。
#worker启动时按进程可打开文件数（ulimit -n / systemd 的 LimitNOFILE）检查：不够时先把软上限抬到硬上限以内，
#仍不够就降低客户端连接上限并记告警，保证fd不会被客户端连接用光
worker_connections = 1024

#Sock_RecyConnectionWaitTime:为确保系统稳定socket关闭后资源不会立即收回，而要等一定的秒数，在这个秒数之后，才进行资源/连接的回收
Sock_RecyConnectionWaitTime = 20

#Sock_MaxPendingPost:每个连接待发事件队列（订阅者尚未 waitpostdata 取走的事件）的上限，用于事件风暴保护。
#队列满后新事件被丢弃并限频记日志，服务不受影响。默认1000，<=0 时按默认值处理
Sock_MaxPendingPost = 1000

#TCP keepalive：客户端掉电、拔网线时不会发FIN/RST，服务端不主动发数据的空闲连接会一直占着fd。
#开启后连接空闲 Sock_KeepAliveIdle 秒开始探测，每隔 Sock_KeepAliveInterval 秒一次，连续 Sock_KeepAliveCount 次无应答即关闭该连接
#（缺省约 60+10*6=120 秒回收死连接；对端只要主机还在，内核就会应答探测，与应用是否空闲无关）。Sock_KeepAlive = 0 关闭
Sock_KeepAlive = 1
Sock_KeepAliveIdle = 60
Sock_KeepAliveInterval = 10
Sock_KeepAliveCount = 6

[QBD]
QbdFilePath = ../qbdfile

